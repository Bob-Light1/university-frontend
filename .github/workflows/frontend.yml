name: Frontend CI

# The repository root IS the frontend, so this workflow must not filter on a
# `frontend/` sub-path: there is none. The previous version did, and could
# therefore never trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # No test step: this codebase carries no test file and no test runner.
      # No lint step either — `npx eslint .` currently reports 91 errors, so
      # adding it would make the build red before it has ever been green.
      # Both are tracked as work, not hidden here.
      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: https://university-backend-7b75.onrender.com/api

      # Blocking, and green: the 19 findings this repository carried (15 high —
      # axios, vite, react-router-dom and twelve transitive) were all in-range and
      # cleared by `npm audit fix` alone, so nothing here needs an exception. The
      # backend needs one and runs scripts/audit-gate.js instead; this side does
      # not, and a plain audit is the honest shape while that stays true.
      - name: Security audit
        run: npm audit --audit-level=high
